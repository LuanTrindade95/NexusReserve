services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/prod/backend.Dockerfile
    environment:
      APP_NAME: NexusReserve
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:?Set REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8081}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-nginx:
    build:
      context: .
      dockerfile: docker/prod/backend-nginx.Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - backend

  horizon:
    build:
      context: .
      dockerfile: docker/prod/backend.Dockerfile
    command: ["php", "artisan", "horizon"]
    environment:
      APP_NAME: NexusReserve
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:?Set REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET}
    depends_on:
      - backend

  reverb:
    build:
      context: .
      dockerfile: docker/prod/backend.Dockerfile
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      APP_NAME: NexusReserve
      APP_ENV: production
      APP_KEY: ${APP_KEY:?Set APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?Set APP_URL}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:?Set REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/prod/frontend.Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend-nginx

volumes:
  mysql_prod_data:
  redis_prod_data:
